# Cluster copy of deploy/compose/prometheus/rules/slo.yml. kube-prometheus-stack
# discovers PrometheusRule CRs by the release label; adjust `release:` to match
# your kube-prometheus-stack Helm release name.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: commerce-slo
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: slo_recording
      interval: 30s
      rules:
        - record: job:grpc_requests:rate5m
          expr: sum by (job) (rate(rpc_server_call_duration_seconds_count[5m]))
        - record: job:grpc_requests:rate30m
          expr: sum by (job) (rate(rpc_server_call_duration_seconds_count[30m]))
        - record: job:grpc_requests:rate1h
          expr: sum by (job) (rate(rpc_server_call_duration_seconds_count[1h]))
        - record: job:grpc_requests:rate6h
          expr: sum by (job) (rate(rpc_server_call_duration_seconds_count[6h]))
        - record: job:grpc_errors:rate5m
          expr: sum by (job) (rate(rpc_server_call_duration_seconds_count{rpc_response_status_code!~"OK|NOT_FOUND|INVALID_ARGUMENT|UNAUTHENTICATED|PERMISSION_DENIED|ALREADY_EXISTS|FAILED_PRECONDITION"}[5m]))
        - record: job:grpc_errors:rate30m
          expr: sum by (job) (rate(rpc_server_call_duration_seconds_count{rpc_response_status_code!~"OK|NOT_FOUND|INVALID_ARGUMENT|UNAUTHENTICATED|PERMISSION_DENIED|ALREADY_EXISTS|FAILED_PRECONDITION"}[30m]))
        - record: job:grpc_errors:rate1h
          expr: sum by (job) (rate(rpc_server_call_duration_seconds_count{rpc_response_status_code!~"OK|NOT_FOUND|INVALID_ARGUMENT|UNAUTHENTICATED|PERMISSION_DENIED|ALREADY_EXISTS|FAILED_PRECONDITION"}[1h]))
        - record: job:grpc_errors:rate6h
          expr: sum by (job) (rate(rpc_server_call_duration_seconds_count{rpc_response_status_code!~"OK|NOT_FOUND|INVALID_ARGUMENT|UNAUTHENTICATED|PERMISSION_DENIED|ALREADY_EXISTS|FAILED_PRECONDITION"}[6h]))
        - record: job:grpc_error_ratio:5m
          expr: job:grpc_errors:rate5m / clamp_min(job:grpc_requests:rate5m, 1e-9)
        - record: job:grpc_error_ratio:30m
          expr: job:grpc_errors:rate30m / clamp_min(job:grpc_requests:rate30m, 1e-9)
        - record: job:grpc_error_ratio:1h
          expr: job:grpc_errors:rate1h / clamp_min(job:grpc_requests:rate1h, 1e-9)
        - record: job:grpc_error_ratio:6h
          expr: job:grpc_errors:rate6h / clamp_min(job:grpc_requests:rate6h, 1e-9)

    - name: slo_burn_rate_alerts
      rules:
        - alert: SLOErrorBudgetFastBurn
          expr: |
            job:grpc_error_ratio:1h > (14.4 * 0.005)
            and
            job:grpc_error_ratio:5m > (14.4 * 0.005)
          for: 2m
          labels: { severity: page, slo: availability }
          annotations:
            summary: "{{ $labels.job }}: burning the availability error budget fast"
            description: >
              {{ $labels.job }} error ratio is {{ $value | humanizePercentage }} over 1h
              (and still elevated over 5m) — at this rate the 30-day budget is gone in ~2 days.
        - alert: SLOErrorBudgetSlowBurn
          expr: |
            job:grpc_error_ratio:6h > (6 * 0.005)
            and
            job:grpc_error_ratio:30m > (6 * 0.005)
          for: 15m
          labels: { severity: ticket, slo: availability }
          annotations:
            summary: "{{ $labels.job }}: slow burn of the availability error budget"
            description: >
              {{ $labels.job }} error ratio is {{ $value | humanizePercentage }} over 6h —
              sustained, this exhausts the 30-day budget early.

    - name: platform_alerts
      rules:
        - alert: ServiceServingNoTraffic
          expr: |
            (sum by (job) (rate(rpc_server_call_duration_seconds_count[10m])) == 0)
            and on() (sum(rate(rpc_server_call_duration_seconds_count[10m])) > 0)
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: "{{ $labels.job }} is serving no gRPC traffic"
            description: "{{ $labels.job }} has had no gRPC calls for 10m while the rest of the platform is active."

    - name: event_pipeline_alerts
      rules:
        # docs/ARCHITECTURE.md §4.3 asks for an alert on any DLQ message. A parked
        # record is one the handler could never accept, set aside so the consumer
        # group keeps moving — nothing else will look at it unless someone is told.
        - alert: RecordsParkedOnDLQ
          expr: sum by (topic) (increase(commerce_kafka_dlq_parked_total[15m])) > 0
          for: 0m
          labels: { severity: ticket }
          annotations:
            summary: "{{ $labels.topic }}: records parked on the dead-letter topic"
            description: >
              {{ $value }} record(s) from {{ $labels.topic }} exhausted their retries in the
              last 15m and were parked on {{ $labels.topic }}.dlq. They are not lost, and the
              group is still moving, but nothing will process them until someone does.

        # Offsets that stop advancing are the failure the DLQ exists to prevent.
        # Sustained holds mean either no DLQ is configured for that consumer, or
        # the DLQ publish itself is failing, or a downstream is applying
        # backpressure it never recovers from.
        - alert: ConsumerOffsetsHeld
          expr: sum by (topic, reason) (rate(commerce_kafka_offsets_held_total[10m])) > 0
          for: 15m
          labels: { severity: ticket }
          annotations:
            summary: "{{ $labels.topic }}: offsets held for 15m ({{ $labels.reason }})"
            description: >
              A consumer of {{ $labels.topic }} has been unable to complete or park records for
              15m (reason: {{ $labels.reason }}). Its group offsets are frozen, so lag is growing
              and a restart will reprocess everything since the stuck point.

        # The relay drains until empty each tick, so a backlog that persists means
        # it is failing to publish, not merely behind.
        - alert: OutboxBacklogNotDraining
          expr: commerce_outbox_pending > 0
          for: 10m
          labels: { severity: ticket }
          annotations:
            summary: "{{ $labels.service }}: outbox not draining"
            description: >
              {{ $labels.service }} has had {{ $value }} unpublished outbox rows for 10m. Domain
              writes are committing but their events are not reaching Kafka, so every consumer
              downstream is working from stale state.

        - alert: OutboxRowStuck
          expr: commerce_outbox_oldest_age > 300
          for: 5m
          labels: { severity: page }
          annotations:
            summary: "{{ $labels.service }}: an outbox row is {{ $value | humanizeDuration }} old"
            description: >
              The oldest unpublished row in {{ $labels.service }}'s outbox predates the last
              5 minutes. Publishing stops at the first failure to preserve per-key ordering, so
              one stuck row blocks every event behind it.

    - name: saga_alerts
      rules:
        # A compensation that never completes is stock or money held against an
        # order that no longer exists. The reconciler retries, so anything still
        # outstanding after several sweeps is not retrying its way out.
        - alert: SagaCompensationOutstanding
          expr: commerce_saga_compensation_outstanding > 0
          for: 30m
          labels: { severity: page }
          annotations:
            summary: "{{ $value }} cancelled order(s) still awaiting compensation"
            description: >
              Cancelled orders have had an outstanding Release or Void for 30m despite the
              reconciler retrying. A stuck Void means a customer's card authorisation is still
              live against an order that was cancelled.

        - alert: SagaCompensationRetriesFailing
          expr: sum by (kind) (rate(commerce_saga_compensation_retries_total{outcome="failed"}[15m])) > 0
          for: 15m
          labels: { severity: ticket }
          annotations:
            summary: "saga compensation retries failing ({{ $labels.kind }})"
            description: >
              The reconciler has been retrying {{ $labels.kind }} compensations unsuccessfully for
              15m — the downstream it calls is still refusing them.
