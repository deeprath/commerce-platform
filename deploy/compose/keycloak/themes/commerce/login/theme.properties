# Custom login theme (approach B in docs/ARCHITECTURE.md §7.2 / ADR-008).
# Inherits Keycloak's login flow markup (so MFA, recovery, email verification,
# and social login all keep working) and only re-skins it. Upgrade-safe.
parent=keycloak
import=common/keycloak

styles=css/login.css
stylesCommon=

# Show these on the login card.
kcLogoIdP-commerce=Commerce

locales=en
