# Local stand-in for the production CDN (CloudFront / Fastly). It is a caching
# reverse proxy in front of the MinIO `product-media` bucket: it serves product
# images, caches them at the edge, and never forwards anything but idempotent
# reads to the origin. In production this role is a managed CDN with the object
# store (or the media service) as origin; the media service already emits
# CDN-based URLs via MEDIA_PUBLIC_BASE_URL, so nothing app-side changes.

worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  proxy_http_version 1.1;

  # JSON access log with the cache disposition, so Loki/Grafana can chart the
  # hit ratio (the stub_status exporter doesn't expose per-cache counters).
  log_format cdn_json escape=json '{'
    '"time":"$time_iso8601",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"cache_status":"$upstream_cache_status",'
    '"rt":$request_time'
  '}';
  access_log /dev/stdout cdn_json;

  # 500 MB on-disk cache, keys live 10 min after last use.
  proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:16m
                   max_size=500m inactive=10m use_temp_path=off;

  # The cache key deliberately excludes the query string: presigned params and
  # cache-busters must not fragment the cache or open a cache-poisoning vector.
  proxy_cache_key "$scheme$request_method$host$uri";

  upstream origin { server minio:9000; keepalive 16; }

  server {
    listen 80;

    # Only immutable, content-addressed product media is proxied. Everything
    # else (bucket listings, other buckets, the MinIO console) is refused here.
    location /product-media/ {
      limit_except GET HEAD { deny all; }

      proxy_pass http://origin;
      proxy_set_header Host $host;
      proxy_set_header Connection "";

      # Trust our own policy over whatever the origin says.
      proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
      proxy_hide_header Set-Cookie;
      proxy_hide_header x-amz-id-2;
      proxy_hide_header x-amz-request-id;
      proxy_hide_header x-amz-meta-mc-attrs;

      proxy_cache media;
      proxy_cache_valid 200 206 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_revalidate on;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;

      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Access-Control-Allow-Origin "*" always;
    }

    # Prometheus scrape target (nginx-prometheus-exporter reads this).
    location = /nginx_status {
      stub_status;
      access_log off;
    }

    location = /healthz { return 200 "ok\n"; }
    location / { return 404; }
  }
}
