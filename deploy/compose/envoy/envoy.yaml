# Local edge proxy. Mirrors what the Istio ingress gateway does in Kubernetes:
#  - terminates HTTP on :8080
#  - runs the Coraza (OWASP CRS) WAF proxy-wasm filter first
#  - calls the ext-authz gRPC service for a shallow pre-check on every request
#  - applies a global rate limit via the ratelimit service
#  - routes /api/v1/* to the BFF (added in Phase 1; until then these 503)
#
# The .wasm is baked into the image by deploy/docker/envoy.Dockerfile. In
# Kubernetes the same WAF is an Istio WasmPlugin on the ingress gateway
# (deploy/istio/waf-wasmplugin.yaml) and the rest is Gateway API + Istio
# resources under deploy/istio/ — see docs/ARCHITECTURE.md §8.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    - name: http
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: edge
                generate_request_id: true
                use_remote_address: true
                route_config:
                  name: local
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        # This is an API-only edge — nothing here is meant to be crawled
                        # or indexed. Without an explicit route, /robots.txt and
                        # /sitemap.xml fall through to Envoy's default 404, which has no
                        # anti-caching header and reads as storable/cacheable to a scanner
                        # (ZAP 10049 — see docs/SECURITY.md §5.4). Serving real content
                        # with an explicit no-store both fixes that and is the correct
                        # behavior for an API service anyway. ext_authz is disabled per-route
                        # here — these are static, unauthenticated-by-design responses, and
                        # ext_authz runs at the filter-chain level (before route match), so
                        # without this it 401s a request that never reaches the BFF anyway.
                        - match: { path: "/robots.txt" }
                          direct_response:
                            status: 200
                            body: { inline_string: "User-agent: *\nDisallow: /\n" }
                          response_headers_to_add:
                            - header: { key: "Content-Type", value: "text/plain" }
                            - header: { key: "Cache-Control", value: "no-store" }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { path: "/sitemap.xml" }
                          direct_response:
                            status: 200
                            body:
                              inline_string: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<urlset xmlns=\"http://www.sitemaps.org/schemas/sitemap/0.9\"/>\n"
                          response_headers_to_add:
                            - header: { key: "Content-Type", value: "application/xml" }
                            - header: { key: "Cache-Control", value: "no-store" }
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match: { prefix: "/api/v1/" }
                          route:
                            cluster: bff
                            timeout: 15s
                            rate_limits:
                              - actions:
                                  - { request_headers: { header_name: ":path", descriptor_key: "path" } }
                      response_headers_to_add:
                        - header: { key: "x-edge", value: "envoy-local" }
                http_filters:
                  # WAF first — a malicious payload never reaches ext-authz,
                  # the rate limiter, or the BFF. Coraza runs OWASP CRS v4
                  # (bundled in the wasm) in anomaly-scoring blocking mode.
                  - name: envoy.filters.http.wasm
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.wasm.v3.Wasm
                      config:
                        name: coraza
                        root_id: coraza
                        vm_config:
                          runtime: envoy.wasm.runtime.v8
                          code:
                            local: { filename: /etc/envoy/coraza-proxy-wasm.wasm }
                        configuration:
                          "@type": type.googleapis.com/google.protobuf.StringValue
                          value: |
                            {
                              "directives_map": {
                                "edge": [
                                  "Include @demo-conf",
                                  "Include @crs-setup-conf",
                                  "SecAction \"id:900200,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'\"",
                                  "Include @owasp_crs/*.conf",
                                  "SecRuleEngine On",
                                  "SecRequestBodyAccess On",
                                  "SecResponseBodyAccess Off",
                                  "SecAuditEngine RelevantOnly",
                                  "SecAuditLogParts ABIJDEFHZ",
                                  "SecAuditLog /dev/stdout",
                                  "SecAuditLogFormat JSON"
                                ]
                              },
                              "default_directives": "edge"
                            }
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc: { cluster_name: ext_authz }
                        timeout: 1s
                  - name: envoy.filters.http.ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
                      domain: edge
                      failure_mode_deny: false
                      rate_limit_service:
                        transport_api_version: V3
                        grpc_service:
                          envoy_grpc: { cluster_name: ratelimit }
                          timeout: 1s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: bff
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: bff
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: bff, port_value: 8080 } }
    - name: ext_authz
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: ext_authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: ext-authz, port_value: 50051 } }
    - name: ratelimit
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config: { http2_protocol_options: {} }
      load_assignment:
        cluster_name: ratelimit
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address: { socket_address: { address: ratelimit, port_value: 8081 } }
