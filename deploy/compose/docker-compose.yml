# Local full-stack for development. NOT a production topology:
#  - no service mesh (containers talk plaintext on the compose network)
#  - the edge is plain Envoy with a hand-written config, not Envoy Gateway /
#    Gateway API (Kubernetes runs the real thing) — see docs/ARCHITECTURE.md §8.7
#  - single-node Kafka / OpenSearch, security plugins off
name: commerce

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  commerce: {}

volumes:
  pgdata: {}
  minio: {}
  opensearch: {}
  grafana: {}
  clickhouse: {}

services:
  # ---------------------------------------------------------------- infra
  postgres:
    image: postgres:${PG_TAG}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [commerce]
    logging: *default-logging

  redis:
    image: redis:${REDIS_TAG}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [commerce]
    logging: *default-logging

  kafka:
    image: apache/kafka:${KAFKA_TAG}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commerce]
    logging: *default-logging

  # Heavy, and only needed once services publish Protobuf events (Phase 2+).
  # Start with:  docker compose --profile full up -d   (or `task up:full`)
  schema-registry:
    image: confluentinc/cp-schema-registry:${SCHEMA_REGISTRY_TAG}
    profiles: ["full"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8085
    ports: ["8085:8085"]
    networks: [commerce]
    logging: *default-logging

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_TAG}
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes: ["opensearch:/usr/share/opensearch/data"]
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commerce]
    logging: *default-logging

  # OLAP store for the analytics service (Phase 5). Single-node; a ClickHouse
  # Keeper / replicated cluster is the prod topology.
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_TAG}
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: analytics
      CLICKHOUSE_PASSWORD: analytics
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: ["clickhouse:/var/lib/clickhouse"]
    ports: ["8123:8123", "9002:9000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commerce]
    logging: *default-logging

  # Fine-grained (ReBAC / Zanzibar-style) authorization store. The order service
  # uses it for delegated order sharing (ADR-035). One-shot migrate, then run.
  openfga-migrate:
    image: openfga/openfga:${OPENFGA_TAG}
    command: ["migrate"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [commerce]
    logging: *default-logging

  openfga:
    image: openfga/openfga:${OPENFGA_TAG}
    command: ["run"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
      OPENFGA_PLAYGROUND_ENABLED: "false"
    ports:
      - "8083:8080" # HTTP API
      - "8082:8081" # gRPC API
    depends_on:
      postgres: { condition: service_healthy }
      openfga-migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commerce]
    logging: *default-logging

  minio:
    image: minio/minio:${MINIO_TAG}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio:/data"]
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commerce]
    logging: *default-logging

  minio-init:
    image: minio/mc:${MC_TAG}
    depends_on:
      minio: { condition: service_healthy }
    volumes: ["./seed/media:/seed-media:ro"]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      for b in product-media invoices exports security-reports; do
        mc mb --ignore-existing local/$$b;
        mc version enable local/$$b;
      done &&
      mc anonymous set download local/product-media &&
      mc cp /seed-media/placeholder.png local/product-media/seed/placeholder.png &&
      echo 'minio buckets ready'"
    networks: [commerce]
    logging: *default-logging

  # Local stand-in for the production CDN: a caching reverse proxy in front of
  # the product-media bucket. Prod is a managed CDN with the object store as
  # origin; the media service already serves CDN-based URLs (MEDIA_PUBLIC_BASE_URL).
  cdn:
    image: nginx:${NGINX_TAG}
    volumes: ["./cdn/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8086:80"]
    depends_on:
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [commerce]
    logging: *default-logging

  cdn-exporter:
    image: nginx/nginx-prometheus-exporter:${NGINX_EXPORTER_TAG}
    command: ["--nginx.scrape-uri=http://cdn:80/nginx_status"]
    depends_on:
      cdn: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_TAG}
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Stamp a stable issuer on every token (browser-facing URL) while still
      # answering backchannel JWKS/token calls on the in-network keycloak:8080.
      # This is the KEYCLOAK_ISSUER_URL vs KEYCLOAK_SERVER_URL split.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/realm-commerce.json:/opt/keycloak/data/import/realm-commerce.json:ro
      - ./keycloak/themes/commerce:/opt/keycloak/themes/commerce:ro
    ports: ["8081:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [commerce]
    logging: *default-logging

  # ---------------------------------------------------- observability
  otel-collector:
    image: otel/opentelemetry-collector-contrib:${OTELCOL_TAG}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]
    depends_on: [tempo, prometheus, loki]
    networks: [commerce]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:${PROM_TAG}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --enable-feature=otlp-write-receiver
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    ports: ["9090:9090"]
    networks: [commerce]
    logging: *default-logging

  loki:
    image: grafana/loki:${LOKI_TAG}
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./loki/loki.yaml:/etc/loki/config.yaml:ro"]
    ports: ["3100:3100"]
    networks: [commerce]
    logging: *default-logging

  # Tails all container stdout into Loki with a service_name label (the job a
  # Grafana Alloy / Promtail DaemonSet does in Kubernetes).
  alloy:
    image: grafana/alloy:${ALLOY_TAG}
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [commerce]
    logging: *default-logging

  tempo:
    image: grafana/tempo:${TEMPO_TAG}
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes: ["./tempo/tempo.yaml:/etc/tempo/config.yaml:ro"]
    ports: ["3200:3200"]
    networks: [commerce]
    logging: *default-logging

  grafana:
    image: grafana/grafana:${GRAFANA_TAG}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, loki, tempo]
    networks: [commerce]
    logging: *default-logging

  # ------------------------------------------------------------- edge
  ratelimit-redis:
    image: redis:${REDIS_TAG}
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [commerce]
    logging: *default-logging

  ratelimit:
    image: envoyproxy/ratelimit:${RATELIMIT_TAG}
    command: ["/bin/ratelimit"]
    depends_on: [ratelimit-redis]
    environment:
      USE_STATSD: "false"
      LOG_LEVEL: warn
      REDIS_SOCKET_TYPE: tcp
      REDIS_URL: ratelimit-redis:6379
      RUNTIME_ROOT: /data
      RUNTIME_SUBDIRECTORY: ratelimit
      RUNTIME_WATCH_ROOT: "false"
      RUNTIME_IGNOREDOTFILES: "true"
    volumes:
      - ./ratelimit/config.yaml:/data/ratelimit/config/config.yaml:ro
    networks: [commerce]
    logging: *default-logging

  ext-authz:
    build:
      context: ../..
      dockerfile: deploy/docker/ext-authz.Dockerfile
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      LOG_LEVEL: debug
    depends_on: [otel-collector]
    networks: [commerce]
    logging: *default-logging

  # ------------------------------------------------------ domain services
  catalog:
    build:
      context: ../..
      dockerfile: deploy/docker/catalog.Dockerfile
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/catalog?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
      OPENFGA_API_URL: http://openfga:8080 # per-shop catalog authz (ADR-040)
      OPENFGA_STORE_NAME: commerce
    ports: ["50053:50051"] # host access for grpcurl during dev
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      openfga: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  media:
    build:
      context: ../..
      dockerfile: deploy/docker/media.Dockerfile
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/media?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
      # Internal client (HEAD etc.) talks to minio:9000; upload URLs are signed
      # for localhost:9000 so a browser on the host can PUT to them directly.
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Canonical served URL host = the CDN edge (see the `cdn` service), not
      # MinIO directly. Presigned *upload* URLs still target MINIO_PUBLIC_ENDPOINT.
      MEDIA_PUBLIC_BASE_URL: http://localhost:8086
    ports: ["50054:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  search:
    build:
      context: ../..
      dockerfile: deploy/docker/search.Dockerfile
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OPENSEARCH_ADDRESSES: http://opensearch:9200
      KAFKA_BROKERS: kafka:9092
    ports: ["50055:50051"]
    depends_on:
      opensearch: { condition: service_healthy }
      kafka: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  pricing:
    build: { context: ../.., dockerfile: deploy/docker/pricing.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/pricing?sslmode=disable
      CATALOG_ADDR: catalog:50051
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
      TAX_RATE_BPS: "800"
    ports: ["50056:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  inventory:
    build: { context: ../.., dockerfile: deploy/docker/inventory.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/inventory?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
      DEFAULT_STOCK_ON_HAND: "100"
      RESERVATION_SWEEP_INTERVAL: "10s"
    ports: ["50057:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  cart:
    build: { context: ../.., dockerfile: deploy/docker/cart.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      REDIS_URL: redis://redis:6379/1
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
    ports: ["50058:50051"]
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  payment:
    build: { context: ../.., dockerfile: deploy/docker/payment.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
    ports: ["50059:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  order:
    build: { context: ../.., dockerfile: deploy/docker/order.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/order?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
      CART_ADDR: cart:50051
      PRICING_ADDR: pricing:50051
      INVENTORY_ADDR: inventory:50051
      PAYMENT_ADDR: payment:50051
      OPENFGA_API_URL: http://openfga:8080 # delegated order sharing (ADR-035)
      OPENFGA_STORE_NAME: commerce
    ports: ["50060:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      openfga: { condition: service_healthy }
      cart: { condition: service_started }
      pricing: { condition: service_started }
      inventory: { condition: service_started }
      payment: { condition: service_started }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  fulfillment:
    build: { context: ../.., dockerfile: deploy/docker/fulfillment.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/fulfillment?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
      # Short sandbox-carrier delays so the demo lifecycle completes in ~1 min.
      CARRIER_SWEEP_INTERVAL: 10s
      CARRIER_PENDING_AFTER: 20s
      CARRIER_SHIPPED_AFTER: 40s
    ports: ["50061:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  notification:
    build: { context: ../.., dockerfile: deploy/docker/notification.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
    ports: ["50062:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  review:
    build: { context: ../.., dockerfile: deploy/docker/review.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/review?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
    ports: ["50063:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  seller:
    build: { context: ../.., dockerfile: deploy/docker/seller.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/seller?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
      OPENFGA_API_URL: http://openfga:8080 # shop staff relationships (ADR-039)
      OPENFGA_STORE_NAME: commerce
    ports: ["50065:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      openfga: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  payout:
    build: { context: ../.., dockerfile: deploy/docker/payout.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/payout?sslmode=disable
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://localhost:8081/realms/commerce
      OPENFGA_API_URL: http://openfga:8080 # a seller reading their own shop's payouts (ADR-043)
      OPENFGA_STORE_NAME: commerce
      # Short sandbox-settlement delay so the demo lifecycle completes quickly.
      SETTLEMENT_SWEEP_INTERVAL: 10s
      SETTLEMENT_PENDING_AFTER: 20s
    ports: ["50066:50051"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      openfga: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  analytics:
    build: { context: ../.., dockerfile: deploy/docker/analytics.Dockerfile }
    environment:
      GRPC_ADDR: ":50051"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      KAFKA_BROKERS: kafka:9092
      CLICKHOUSE_DSN: clickhouse://analytics:analytics@clickhouse:9000/analytics
      ANALYTICS_FLUSH_INTERVAL: 2s
    ports: ["50064:50051"]
    depends_on:
      kafka: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  bff:
    build:
      context: ../..
      dockerfile: deploy/docker/bff.Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      ENVIRONMENT: local
      LOG_LEVEL: debug
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      CATALOG_ADDR: catalog:50051
      MEDIA_ADDR: media:50051
      SEARCH_ADDR: search:50051
      CART_ADDR: cart:50051
      PRICING_ADDR: pricing:50051
      ORDER_ADDR: order:50051
      PAYMENT_ADDR: payment:50051
      FULFILLMENT_ADDR: fulfillment:50051
      REVIEW_ADDR: review:50051
      SELLER_ADDR: seller:50051
      PAYOUT_ADDR: payout:50051
      KAFKA_BROKERS: kafka:9092 # clickstream ingestion (POST /api/v1/events)
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/commerce/protocol/openid-connect/token
      KEYCLOAK_CLIENT_ID: bff
      KEYCLOAK_CLIENT_SECRET: local-dev-bff-secret
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
    ports: ["8088:8080"] # direct BFF access for dev; prod goes via the gateway
    depends_on:
      catalog: { condition: service_started }
      media: { condition: service_started }
      search: { condition: service_started }
      cart: { condition: service_started }
      pricing: { condition: service_started }
      order: { condition: service_started }
      payment: { condition: service_started }
      fulfillment: { condition: service_started }
      review: { condition: service_started }
      seller: { condition: service_started }
      payout: { condition: service_started }
      kafka: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      otel-collector: { condition: service_started }
    networks: [commerce]
    logging: *default-logging

  # One-shot demo-catalog seeder. Idempotent — runs on every `up`, exits 0 once
  # the products exist. Also gives every product a stock row (catalog emits
  # product_changed -> inventory consumer). See deploy/compose/seed/.
  catalog-seed:
    image: curlimages/curl:${CURL_TAG}
    entrypoint: ["sh", "/seed/seed.sh"]
    volumes: ["./seed:/seed:ro"]
    depends_on:
      bff: { condition: service_started }
      keycloak: { condition: service_healthy }
    restart: "no"
    networks: [commerce]
    logging: *default-logging

  storefront:
    build:
      context: ../..
      dockerfile: deploy/docker/storefront.Dockerfile
      args:
        VITE_MEDIA_BASE_URL: http://localhost:8086
    environment:
      BFF_UPSTREAM: http://bff:8080
      MEDIA_ORIGIN: http://localhost:8086
    ports: ["5173:8080"]
    depends_on: [bff]
    networks: [commerce]
    logging: *default-logging

  admin:
    build:
      context: ../..
      dockerfile: deploy/docker/admin.Dockerfile
    environment:
      BFF_UPSTREAM: http://bff:8080
      MEDIA_ORIGIN: http://localhost:8086
    ports: ["5174:8080"]
    depends_on: [bff]
    networks: [commerce]
    logging: *default-logging

  envoy:
    build:
      context: ../..
      dockerfile: deploy/docker/envoy.Dockerfile
      args:
        ENVOY_TAG: ${ENVOY_TAG:-v1.32-latest}
    command: ["-c", "/etc/envoy/envoy.yaml", "-l", "info"]
    volumes: ["./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro"]
    ports: ["8080:8080", "9901:9901"]
    depends_on: [ext-authz, ratelimit]
    networks: [commerce]
    logging: *default-logging
