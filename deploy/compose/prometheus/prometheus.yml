global:
  scrape_interval: 15s
  evaluation_interval: 15s

# SLO recording rules + multi-window burn-rate alerts. In the cluster the same
# rules ship as a PrometheusRule CR (deploy/k8s/observability/).
rule_files:
  - /etc/prometheus/rules/*.yml

# Metrics arrive two ways:
#  - pushed via OTLP from the collector (--enable-feature=otlp-write-receiver)
#  - scraped from infra components that expose /metrics
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs: [{ targets: ["envoy:9901"] }]

  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
