global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Metrics arrive two ways:
#  - pushed via OTLP from the collector (--enable-feature=otlp-write-receiver)
#  - scraped from infra components that expose /metrics
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: envoy
    metrics_path: /stats/prometheus
    static_configs: [{ targets: ["envoy:9901"] }]

  - job_name: otel-collector
    static_configs: [{ targets: ["otel-collector:8888"] }]
