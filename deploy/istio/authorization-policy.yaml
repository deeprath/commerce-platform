# Gateway-scoped authorization only. The per-service default-deny + SPIFFE
# allow-lists (keyed on the ServiceAccounts the workload chart creates) are
# generated by deploy/helm/commerce-services (templates/authorizationpolicy.yaml),
# one `allow-to-<svc>` per service — see that chart's README and ADR-029.

# 1) Shallow edge pre-check: the gateway calls the ext-authz service (registered
#    as the `ext-authz-grpc` extensionProvider in istiod's meshConfig).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-ext-authz
  namespace: commerce
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: commerce-gateway
  action: CUSTOM
  provider:
    name: ext-authz-grpc
  rules:
    - {} # apply to every request reaching the gateway
---
# 2) Namespace default-deny. Nothing is reachable until a per-service
#    `allow-to-<svc>` policy (from the workload chart) permits a caller.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: commerce
spec:
  {} # empty spec = deny all
---
# 3) Admin API source-IP allow-list. Requests to /api/v1/admin/* at the gateway
#    must originate from an operator network (office / VPN CIDR). Everything else
#    on the gateway is unaffected. Combined with the operator-role check the
#    domain services already enforce, this is defence in depth.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: admin-ip-allowlist
  namespace: commerce
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: commerce-gateway
  action: DENY
  rules:
    - to:
        - operation:
            paths: ["/api/v1/admin", "/api/v1/admin/*"]
      from:
        - source:
            notRemoteIpBlocks:
              # Replace with the real operator ranges before production.
              - "10.0.0.0/8"
              - "192.168.0.0/16"
