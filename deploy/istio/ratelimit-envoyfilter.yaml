# Global edge rate limiting on the ingress gateway, backed by the standalone
# envoyproxy/ratelimit service (+ Redis). Descriptors mirror
# deploy/compose/ratelimit/config.yaml so local and cluster behave the same.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: edge-ratelimit
  namespace: commerce
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: commerce-gateway
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.ratelimit
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ratelimit.v3.RateLimit
            domain: edge
            failure_mode_deny: false
            timeout: 1s
            rate_limit_service:
              transport_api_version: V3
              grpc_service:
                envoy_grpc:
                  cluster_name: outbound|8081||ratelimit.commerce.svc.cluster.local
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
      patch:
        operation: MERGE
        value:
          rate_limits:
            - actions:
                - request_headers:
                    header_name: ":path"
                    descriptor_key: "path"
