# Storefront + admin API traffic -> the BFF. The BFF is added in Phase 1; until
# then this route resolves to a Service with no endpoints and returns 503.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-storefront
  namespace: commerce
spec:
  parentRefs:
    - name: commerce-gateway
  hostnames: ["store.commerce.example.com"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/v1 }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: x-edge
                value: istio-gateway
      backendRefs:
        - name: bff
          port: 8080
      timeouts:
        request: 15s
---
# The admin console and its API. Same BFF, separate hostname, and locked to an
# operator source-IP range by the AuthorizationPolicy `admin-ip-allowlist`
# (authorization-policy.yaml). The BFF still forwards the token and the domain
# services still enforce the operator role — the IP allow-list is defence in
# depth, not the only gate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-admin
  namespace: commerce
spec:
  parentRefs:
    - name: commerce-gateway
  hostnames: ["admin.commerce.example.com"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/v1/admin }
      backendRefs:
        - name: bff
          port: 8080
      timeouts:
        request: 15s
