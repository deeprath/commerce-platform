# Storefront API traffic -> the BFF.
#
# The two weighted backendRefs are managed by Argo Rollouts' Gateway API
# traffic-router plugin (the `bff` Rollout in deploy/helm/commerce-services):
# steady state is bff=100 / bff-canary=0; during a rollout the plugin shifts
# weight to bff-canary per the Rollout's `steps`. Leave them here so the plugin
# has both to adjust.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-storefront
  namespace: commerce
spec:
  parentRefs:
    - name: commerce-gateway
  hostnames: ["store.commerce.example.com"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/v1 }
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: x-edge
                value: istio-gateway
      backendRefs:
        - name: bff
          port: 8080
          weight: 100
        - name: bff-canary
          port: 8080
          weight: 0
      timeouts:
        request: 15s
---
# The admin console and its API. Same BFF, separate hostname, and locked to an
# operator source-IP range by the AuthorizationPolicy `admin-ip-allowlist`
# (authorization-policy.yaml). The BFF still forwards the token and the domain
# services still enforce the operator role — the IP allow-list is defence in
# depth, not the only gate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bff-admin
  namespace: commerce
spec:
  parentRefs:
    - name: commerce-gateway
  hostnames: ["admin.commerce.example.com"]
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api/v1/admin }
      backendRefs:
        - name: bff
          port: 8080
      timeouts:
        request: 15s
