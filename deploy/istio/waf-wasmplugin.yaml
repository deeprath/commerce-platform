# OWASP CRS WAF on the ingress gateway (Coraza proxy-wasm).
#
# The cluster equivalent of the wasm filter baked into the local edge Envoy
# (deploy/docker/envoy.Dockerfile + deploy/compose/envoy/envoy.yaml). Same
# module version, same directives — CRS v4 (bundled in the module) in
# anomaly-scoring blocking mode.
#
# phase: AUTHN runs the WAF before Istio's ext-authz (CUSTOM AuthorizationPolicy)
# and the rate-limit EnvoyFilter, so a malicious payload is dropped at the edge
# before any of them see it.
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: edge-waf
  namespace: commerce
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: commerce-gateway
  url: oci://ghcr.io/corazawaf/coraza-proxy-wasm:0.6.0
  # Pin the layer digest before production (crane digest oci://ghcr.io/...:0.6.0).
  # sha256: <digest>
  imagePullPolicy: IfNotPresent
  phase: AUTHN
  failStrategy: FAIL_CLOSE
  pluginConfig:
    directives_map:
      edge:
        - "Include @demo-conf"
        - "Include @crs-setup-conf"
        # The JSON API legitimately uses PUT (cart qty, admin catalog) and DELETE
        # (cart items, order share revoke). Widen CRS 911100's allow-list before
        # the rules load. See ADR-027 / ADR-035.
        - "SecAction \"id:900200,phase:1,nolog,pass,t:none,setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'\""
        - "Include @owasp_crs/*.conf"
        - "SecRuleEngine On"
        - "SecRequestBodyAccess On"
        - "SecResponseBodyAccess Off"
        - "SecAuditEngine RelevantOnly"
        - "SecAuditLogParts ABIJDEFHZ"
        - "SecAuditLog /dev/stdout"
        - "SecAuditLogFormat JSON"
    default_directives: edge
