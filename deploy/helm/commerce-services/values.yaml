# Default (production-shaped) values for the commerce-services chart.
# Override per environment with values-<env>.yaml.

global:
  namespace: commerce

  image:
    registry: ghcr.io/deeprath/commerce-platform
    # Empty -> Chart.appVersion. CI/CD sets this to the release tag / git sha.
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []

  # Env every service gets (merged under per-service `env`, which wins).
  commonEnv:
    ENVIRONMENT: production
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.observability.svc.cluster.local:4317

  # Shared, non-secret infra endpoints. Referenced by services that opt in via
  # `kafka: true` / `auth: true` / `redis: true`.
  kafkaBrokers: kafka.commerce.svc.cluster.local:9092
  redisURL: redis://redis.commerce.svc.cluster.local:6379/1
  keycloak:
    jwksURL: http://keycloak.commerce.svc.cluster.local:8080/realms/commerce/protocol/openid-connect/certs
    tokenURL: http://keycloak.commerce.svc.cluster.local:8080/realms/commerce/protocol/openid-connect/token
    issuer: https://auth.commerce.example.com/realms/commerce

  # Secret with per-service DATABASE_URL keys (<SERVICE>_DATABASE_URL), the BFF
  # client secret, MinIO keys, etc. Provisioned out of band (External Secrets
  # Operator + Vault) — never templated by this chart.
  secretName: commerce-services

  # L3/L4 targets for the generated NetworkPolicies. `port` is what the pod
  # listens on; selectors match pods in `global.namespace` unless `namespace`
  # is set.
  infra:
    postgres: { selector: { app: postgres }, port: 5432 }
    kafka: { selector: { app: kafka }, port: 9092 }
    redis: { selector: { app: redis }, port: 6379 }
    keycloak: { selector: { app: keycloak }, port: 8080 }
    otelCollector: { namespace: observability, selector: { app.kubernetes.io/name: opentelemetry-collector }, port: 4317 }
  # SA name of the Istio ingress gateway (matches deploy/istio/*), and the pod
  # label NetworkPolicies use to select it.
  gateway:
    serviceAccount: commerce-gateway
    podSelector: { gateway.networking.k8s.io/gateway-name: commerce-gateway }

  # In-cluster Prometheus, for KEDA's `prometheus` trigger (gRPC RPS).
  prometheusURL: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090

  # Master switch for KEDA ScaledObjects (a per-service `autoscaling.enabled`
  # still gates each one). Turn off for clusters without KEDA / Prometheus.
  autoscaling:
    enabled: true

  # Master switch for Argo Rollouts progressive delivery (a per-service
  # rollout.enabled still gates each one).
  rollout:
    enabled: true

  # Master switch for multi-zone topology: adds a zone-level pod-spread
  # constraint and renders a per-service Istio DestinationRule with
  # locality-aware load balancing + zone failover. Off for single-zone / kind
  # clusters (values-dev.yaml).
  multiZone:
    enabled: true
    # The Gateway API HTTPRoute a canary shifts weight on (BFF only for now).
    httpRoute: bff-storefront

# Applied to every service unless overridden in the `services` map.
defaults:
  replicas: 2
  protocol: grpc # grpc | http
  port: 50051
  terminationGracePeriodSeconds: 40
  revisionHistoryLimit: 3
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  podDisruptionBudget:
    enabled: true
    # Set exactly one of minAvailable / maxUnavailable. maxUnavailable as a
    # percentage lets a single-zone voluntary drain proceed while still blocking
    # a whole-service eviction (critical services set maxUnavailable: 34%).
    minAvailable: 1
    maxUnavailable: null
  topologySpread:
    enabled: true
    maxSkew: 1
    # Node-level spread is always soft — pack the cluster evenly, never block.
    node:
      whenUnsatisfiable: ScheduleAnyway
    # Zone-level spread is added only when global.multiZone.enabled. Soft by
    # default; critical services flip this to DoNotSchedule to *guarantee* a
    # per-zone copy (needs replicas >= zone count).
    zone:
      enabled: true
      whenUnsatisfiable: ScheduleAnyway
  # Istio DestinationRule: keep service-to-service gRPC in-zone, fail over to
  # another zone on unhealthy endpoints. Rendered only when
  # global.multiZone.enabled. A no-op in a single-zone cluster.
  localityLB:
    enabled: true
  networkPolicy:
    enabled: true
  authorizationPolicy:
    enabled: true
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    # HPA won't remove a pod until the metric has been below target this long.
    scaleDownStabilizationSeconds: 300
  rollout:
    enabled: false
    mirror: true # shadow 100% of traffic to the canary before shifting any weight
    analysis: true # a background AnalysisRun (<svc>-canary) aborts on SLO breach
    # Canary weight schedule; each `pause` waits for a human `promote` (or a
    # duration). The background analysis runs across all of them.
    steps:
      - { setWeight: 10 }
      - { pause: { duration: 2m } }
      - { setWeight: 30 }
      - { pause: { duration: 5m } }
      - { setWeight: 60 }
      - { pause: { duration: 5m } }
  # GOMEMLIMIT is set from the memory limit (see _helpers.tpl).
  extraEnv: {}

# --- the services -----------------------------------------------------------
# Flags:
#   protocol/port  - grpc:50051 (default) or http (bff)
#   db: <name>     - inject DATABASE_URL from secret key <NAME>_DATABASE_URL, allow egress to Postgres
#   kafka: true    - inject KAFKA_BROKERS, allow egress to Kafka
#   redis: true    - inject REDIS_URL, allow egress to Redis
#   auth: true     - inject KEYCLOAK_JWKS_URL + KEYCLOAK_ISSUER, allow egress to Keycloak
#   envFromSecret  - also envFrom the shared secret (bff needs KEYCLOAK_CLIENT_SECRET)
#   callers        - who may call this service (drives NetworkPolicy ingress + AuthorizationPolicy).
#                    Each entry: a service name, "gateway", or {name, methods: [<rpc>...]}.
#                    A service X's egress to service Y is derived: Y lists X in `callers`.
#   egressExtra    - extra L3/L4 egress targets ({selector, port, namespace?}).
services:
  ext-authz:
    replicas: 3
    callers: [gateway]
    env:
      GRPC_ADDR: ":50051"
    resources:
      requests: { cpu: 25m, memory: 48Mi }
      limits: { cpu: 250m, memory: 128Mi }

  catalog:
    db: catalog
    kafka: true
    auth: true
    callers: [bff, pricing]
    autoscaling:
      enabled: true
      maxReplicas: 12
      triggers: [{ type: rps, threshold: 80 }] # ~80 gRPC req/s per replica
    env: { GRPC_ADDR: ":50051" }

  media:
    db: media
    kafka: true
    auth: true
    envFromSecret: true # MINIO_ACCESS_KEY / MINIO_SECRET_KEY
    callers: [bff]
    egressExtra:
      - { selector: { app: minio }, port: 9000 } # object storage
    env:
      GRPC_ADDR: ":50051"
      MINIO_INTERNAL_ENDPOINT: minio.commerce.svc.cluster.local:9000
      # Canonical served-URL host = the CDN (managed: CloudFront/Fastly with the
      # object store as origin), not the media service. See ADR-036.
      MEDIA_PUBLIC_BASE_URL: https://cdn.commerce.example.com

  search:
    kafka: true
    callers: [bff]
    egressExtra:
      - { selector: { app: opensearch }, port: 9200 } # index
    autoscaling:
      enabled: true
      maxReplicas: 12
      triggers:
        - { type: rps, threshold: 80 }
        - { type: kafkaLag, group: search-indexer, threshold: 200 } # product_changed backlog
    env:
      GRPC_ADDR: ":50051"
      OPENSEARCH_ADDRESSES: http://opensearch.commerce.svc.cluster.local:9200

  cart:
    redis: true
    auth: true
    callers: [bff, order]
    env: { GRPC_ADDR: ":50051" }

  pricing:
    db: pricing
    auth: true
    callers: [bff, order]
    env:
      GRPC_ADDR: ":50051"
      CATALOG_ADDR: catalog.commerce.svc.cluster.local:50051
      TAX_RATE_BPS: "800"

  inventory:
    db: inventory
    kafka: true
    auth: true
    callers: [order]
    env:
      GRPC_ADDR: ":50051"
      DEFAULT_STOCK_ON_HAND: "0" # no dev auto-seed in prod
      RESERVATION_SWEEP_INTERVAL: 15s

  payment:
    db: payment
    kafka: true
    auth: true
    replicas: 3 # >= zone count, so the DoNotSchedule zone spread is satisfiable
    grpcService: commerce.payment.v1.PaymentService # for method-level AuthorizationPolicy
    callers:
      - { name: bff, methods: [ConfirmPayment] }
      - { name: order, methods: [CreatePayment, Refund] }
    topologySpread:
      zone: { whenUnsatisfiable: DoNotSchedule }
    podDisruptionBudget:
      minAvailable: null
      maxUnavailable: 34%
    env: { GRPC_ADDR: ":50051" }

  order:
    db: order
    kafka: true
    auth: true
    replicas: 3
    callers: [bff]
    egressExtra:
      - { selector: { app: openfga }, port: 8080 } # delegated order sharing (ADR-035)
    # Checkout saga orchestrator — per-zone copy guaranteed, one-zone drain cap.
    topologySpread:
      zone: { whenUnsatisfiable: DoNotSchedule }
    podDisruptionBudget:
      minAvailable: null
      maxUnavailable: 34%
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 15
      triggers: [{ type: rps, threshold: 40 }] # checkout is the tight path
    env:
      GRPC_ADDR: ":50051"
      CART_ADDR: cart.commerce.svc.cluster.local:50051
      PRICING_ADDR: pricing.commerce.svc.cluster.local:50051
      INVENTORY_ADDR: inventory.commerce.svc.cluster.local:50051
      PAYMENT_ADDR: payment.commerce.svc.cluster.local:50051
      OPENFGA_API_URL: http://openfga.commerce.svc.cluster.local:8080
      OPENFGA_STORE_NAME: commerce

  fulfillment:
    db: fulfillment
    kafka: true
    auth: true
    callers: [bff]
    autoscaling:
      enabled: true
      maxReplicas: 8
      triggers: [{ type: kafkaLag, group: fulfillment, threshold: 100 }] # order.confirmed backlog
    env:
      GRPC_ADDR: ":50051"
      CARRIER_SWEEP_INTERVAL: 30s
      CARRIER_PENDING_AFTER: 1m
      CARRIER_SHIPPED_AFTER: 5m

  notification:
    db: notification
    kafka: true
    auth: true
    callers: [] # event-driven only; no gRPC caller
    autoscaling:
      enabled: true
      maxReplicas: 8
      triggers: [{ type: kafkaLag, group: notification, threshold: 100 }]
    env: { GRPC_ADDR: ":50051" }

  review:
    db: review
    kafka: true
    auth: true
    callers: [bff] # BFF review client is wired; storefront routes land next
    env: { GRPC_ADDR: ":50051" }

  seller:
    db: seller
    kafka: true # commerce.shop.* via the transactional outbox
    auth: true
    callers: [bff]
    egressExtra:
      - { selector: { app: openfga }, port: 8080 } # shop staff relationships (ADR-039)
    env:
      GRPC_ADDR: ":50051"
      OPENFGA_API_URL: http://openfga.commerce.svc.cluster.local:8080
      OPENFGA_STORE_NAME: commerce

  analytics:
    kafka: true
    callers: [] # consumer-only sink (order.* / payment.* -> ClickHouse)
    egressExtra:
      - { selector: { app: clickhouse }, port: 9000 } # OLAP store
    envFromSecret: true # CLICKHOUSE_DSN (full clickhouse:// URL incl. password)
    autoscaling:
      enabled: true
      maxReplicas: 6
      # Two independent consumer groups: funnel facts and browser clickstream.
      triggers:
        - { type: kafkaLag, group: analytics, threshold: 500 }
        - { type: kafkaLag, group: analytics-clickstream, threshold: 2000 }
    env:
      GRPC_ADDR: ":50051"

  bff:
    protocol: http
    port: 8080
    replicas: 3
    kafka: true # clickstream ingestion (POST /api/v1/events -> commerce.clickstream.tracked)
    envFromSecret: true # KEYCLOAK_CLIENT_SECRET
    callers: [gateway]
    # Edge of the checkout path — guarantee a live copy in every zone and don't
    # let a voluntary drain take more than one zone's worth out at once.
    topologySpread:
      zone: { whenUnsatisfiable: DoNotSchedule }
    podDisruptionBudget:
      minAvailable: null
      maxUnavailable: 34%
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      # HTTP request rate from the otelecho middleware, ~60 req/s per replica.
      triggers:
        - { type: rps, threshold: 60, metric: http_server_request_duration_seconds_count }
    rollout:
      enabled: true # canary via the bff-storefront HTTPRoute
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 384Mi }
    env:
      HTTP_ADDR: ":8080"
      CATALOG_ADDR: catalog.commerce.svc.cluster.local:50051
      MEDIA_ADDR: media.commerce.svc.cluster.local:50051
      SEARCH_ADDR: search.commerce.svc.cluster.local:50051
      CART_ADDR: cart.commerce.svc.cluster.local:50051
      PRICING_ADDR: pricing.commerce.svc.cluster.local:50051
      ORDER_ADDR: order.commerce.svc.cluster.local:50051
      PAYMENT_ADDR: payment.commerce.svc.cluster.local:50051
      FULFILLMENT_ADDR: fulfillment.commerce.svc.cluster.local:50051
      REVIEW_ADDR: review.commerce.svc.cluster.local:50051
      KEYCLOAK_CLIENT_ID: bff
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://store.commerce.example.com,https://admin.commerce.example.com
