# Default (production-shaped) values for the commerce-services chart.
# Override per environment with values-<env>.yaml.

global:
  namespace: commerce

  image:
    registry: ghcr.io/deeprath/commerce-platform
    # Empty -> Chart.appVersion. CI/CD sets this to the release tag / git sha.
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []

  # Env every service gets (merged under per-service `env`, which wins).
  commonEnv:
    ENVIRONMENT: production
    LOG_LEVEL: info
    OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.observability.svc.cluster.local:4317

  # Shared, non-secret infra endpoints. Referenced by services that opt in via
  # `kafka: true` / `auth: true` / `redis: true`.
  kafkaBrokers: kafka.commerce.svc.cluster.local:9092
  redisURL: redis://redis.commerce.svc.cluster.local:6379/1
  keycloak:
    jwksURL: http://keycloak.commerce.svc.cluster.local:8080/realms/commerce/protocol/openid-connect/certs
    tokenURL: http://keycloak.commerce.svc.cluster.local:8080/realms/commerce/protocol/openid-connect/token
    issuer: https://auth.commerce.example.com/realms/commerce

  # Secret with per-service DATABASE_URL keys (<SERVICE>_DATABASE_URL), the BFF
  # client secret, MinIO keys, etc. Provisioned out of band (External Secrets
  # Operator + Vault) — never templated by this chart.
  secretName: commerce-services

  # L3/L4 targets for the generated NetworkPolicies. `port` is what the pod
  # listens on; selectors match pods in `global.namespace` unless `namespace`
  # is set.
  infra:
    postgres: { selector: { app: postgres }, port: 5432 }
    kafka: { selector: { app: kafka }, port: 9092 }
    redis: { selector: { app: redis }, port: 6379 }
    keycloak: { selector: { app: keycloak }, port: 8080 }
    otelCollector: { namespace: observability, selector: { app.kubernetes.io/name: opentelemetry-collector }, port: 4317 }
  # SA name of the Istio ingress gateway (matches deploy/istio/*), and the pod
  # label NetworkPolicies use to select it.
  gateway:
    serviceAccount: commerce-gateway
    podSelector: { gateway.networking.k8s.io/gateway-name: commerce-gateway }

  # In-cluster Prometheus, for KEDA's `prometheus` trigger (gRPC RPS).
  prometheusURL: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090

  # Master switch for KEDA ScaledObjects (a per-service `autoscaling.enabled`
  # still gates each one). Turn off for clusters without KEDA / Prometheus.
  autoscaling:
    enabled: true

# Applied to every service unless overridden in the `services` map.
defaults:
  replicas: 2
  protocol: grpc # grpc | http
  port: 50051
  terminationGracePeriodSeconds: 40
  revisionHistoryLimit: 3
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  topologySpread:
    enabled: true
    maxSkew: 1
  networkPolicy:
    enabled: true
  authorizationPolicy:
    enabled: true
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    # HPA won't remove a pod until the metric has been below target this long.
    scaleDownStabilizationSeconds: 300
  # GOMEMLIMIT is set from the memory limit (see _helpers.tpl).
  extraEnv: {}

# --- the services -----------------------------------------------------------
# Flags:
#   protocol/port  - grpc:50051 (default) or http (bff)
#   db: <name>     - inject DATABASE_URL from secret key <NAME>_DATABASE_URL, allow egress to Postgres
#   kafka: true    - inject KAFKA_BROKERS, allow egress to Kafka
#   redis: true    - inject REDIS_URL, allow egress to Redis
#   auth: true     - inject KEYCLOAK_JWKS_URL + KEYCLOAK_ISSUER, allow egress to Keycloak
#   envFromSecret  - also envFrom the shared secret (bff needs KEYCLOAK_CLIENT_SECRET)
#   callers        - who may call this service (drives NetworkPolicy ingress + AuthorizationPolicy).
#                    Each entry: a service name, "gateway", or {name, methods: [<rpc>...]}.
#                    A service X's egress to service Y is derived: Y lists X in `callers`.
#   egressExtra    - extra L3/L4 egress targets ({selector, port, namespace?}).
services:
  ext-authz:
    replicas: 3
    callers: [gateway]
    env:
      GRPC_ADDR: ":50051"
    resources:
      requests: { cpu: 25m, memory: 48Mi }
      limits: { cpu: 250m, memory: 128Mi }

  catalog:
    db: catalog
    kafka: true
    auth: true
    callers: [bff, pricing]
    autoscaling:
      enabled: true
      maxReplicas: 12
      triggers: [{ type: rps, threshold: 80 }] # ~80 gRPC req/s per replica
    env: { GRPC_ADDR: ":50051" }

  media:
    db: media
    kafka: true
    auth: true
    envFromSecret: true # MINIO_ACCESS_KEY / MINIO_SECRET_KEY
    callers: [bff]
    egressExtra:
      - { selector: { app: minio }, port: 9000 } # object storage
    env:
      GRPC_ADDR: ":50051"
      MINIO_INTERNAL_ENDPOINT: minio.commerce.svc.cluster.local:9000
      MEDIA_PUBLIC_BASE_URL: https://media.commerce.example.com

  search:
    kafka: true
    callers: [bff]
    egressExtra:
      - { selector: { app: opensearch }, port: 9200 } # index
    autoscaling:
      enabled: true
      maxReplicas: 12
      triggers:
        - { type: rps, threshold: 80 }
        - { type: kafkaLag, group: search-indexer, threshold: 200 } # product_changed backlog
    env:
      GRPC_ADDR: ":50051"
      OPENSEARCH_ADDRESSES: http://opensearch.commerce.svc.cluster.local:9200

  cart:
    redis: true
    auth: true
    callers: [bff, order]
    env: { GRPC_ADDR: ":50051" }

  pricing:
    db: pricing
    auth: true
    callers: [bff, order]
    env:
      GRPC_ADDR: ":50051"
      CATALOG_ADDR: catalog.commerce.svc.cluster.local:50051
      TAX_RATE_BPS: "800"

  inventory:
    db: inventory
    kafka: true
    auth: true
    callers: [order]
    env:
      GRPC_ADDR: ":50051"
      DEFAULT_STOCK_ON_HAND: "0" # no dev auto-seed in prod
      RESERVATION_SWEEP_INTERVAL: 15s

  payment:
    db: payment
    kafka: true
    auth: true
    grpcService: commerce.payment.v1.PaymentService # for method-level AuthorizationPolicy
    callers:
      - { name: bff, methods: [ConfirmPayment] }
      - { name: order, methods: [CreatePayment, Refund] }
    env: { GRPC_ADDR: ":50051" }

  order:
    db: order
    kafka: true
    auth: true
    replicas: 3
    callers: [bff]
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 15
      triggers: [{ type: rps, threshold: 40 }] # checkout is the tight path
    env:
      GRPC_ADDR: ":50051"
      CART_ADDR: cart.commerce.svc.cluster.local:50051
      PRICING_ADDR: pricing.commerce.svc.cluster.local:50051
      INVENTORY_ADDR: inventory.commerce.svc.cluster.local:50051
      PAYMENT_ADDR: payment.commerce.svc.cluster.local:50051

  fulfillment:
    db: fulfillment
    kafka: true
    auth: true
    callers: [bff]
    autoscaling:
      enabled: true
      maxReplicas: 8
      triggers: [{ type: kafkaLag, group: fulfillment, threshold: 100 }] # order.confirmed backlog
    env:
      GRPC_ADDR: ":50051"
      CARRIER_SWEEP_INTERVAL: 30s
      CARRIER_PENDING_AFTER: 1m
      CARRIER_SHIPPED_AFTER: 5m

  notification:
    db: notification
    kafka: true
    auth: true
    callers: [] # event-driven only; no gRPC caller
    autoscaling:
      enabled: true
      maxReplicas: 8
      triggers: [{ type: kafkaLag, group: notification, threshold: 100 }]
    env: { GRPC_ADDR: ":50051" }

  review:
    db: review
    kafka: true
    auth: true
    callers: [bff] # BFF review client is wired; storefront routes land next
    env: { GRPC_ADDR: ":50051" }

  bff:
    protocol: http
    port: 8080
    replicas: 3
    envFromSecret: true # KEYCLOAK_CLIENT_SECRET
    callers: [gateway]
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 20
      # HTTP request rate from the otelecho middleware, ~60 req/s per replica.
      triggers:
        - { type: rps, threshold: 60, metric: http_server_request_duration_seconds_count }
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: "1", memory: 384Mi }
    env:
      HTTP_ADDR: ":8080"
      CATALOG_ADDR: catalog.commerce.svc.cluster.local:50051
      MEDIA_ADDR: media.commerce.svc.cluster.local:50051
      SEARCH_ADDR: search.commerce.svc.cluster.local:50051
      CART_ADDR: cart.commerce.svc.cluster.local:50051
      PRICING_ADDR: pricing.commerce.svc.cluster.local:50051
      ORDER_ADDR: order.commerce.svc.cluster.local:50051
      PAYMENT_ADDR: payment.commerce.svc.cluster.local:50051
      FULFILLMENT_ADDR: fulfillment.commerce.svc.cluster.local:50051
      REVIEW_ADDR: review.commerce.svc.cluster.local:50051
      KEYCLOAK_CLIENT_ID: bff
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://store.commerce.example.com,https://admin.commerce.example.com
