# Default (dev) values. Override per environment with values-<env>.yaml.

spec:
  # Argo CD project + destination for every generated Application.
  project: default
  destinationServer: https://kubernetes.default.svc
  repoURL: https://github.com/deeprath/commerce-platform.git
  targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

# Istio meshConfig extension providers, passed to the istiod Application's Helm
# values. These names are referenced by deploy/istio/*.yaml.
istio:
  profile: ambient
  meshConfig:
    extensionProviders:
      - name: otel
        opentelemetry:
          service: otel-collector.observability.svc.cluster.local
          port: 4317
      - name: ext-authz-grpc
        envoyExtAuthzGrpc:
          service: ext-authz.commerce.svc.cluster.local
          port: 50051
      - name: edge-ratelimit
        envoyRateLimit:
          service: ratelimit.commerce.svc.cluster.local
          port: 8081

# Each entry becomes one Argo CD Application. Charts are pinned by version.
applications:
  - name: gateway-api-crds
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.2.0
    path: config/crd/standard
    namespace: default

  - name: istio-base
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.24.1
    namespace: istio-system

  - name: istiod
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.24.1
    namespace: istio-system
    valuesFromKey: istio

  - name: istio-cni
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: cni
    targetRevision: 1.24.1
    namespace: istio-system

  - name: ztunnel
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: ztunnel
    targetRevision: 1.24.1
    namespace: istio-system

  - name: cert-manager
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    namespace: cert-manager
    helmValues: |
      crds:
        enabled: true

  - name: external-secrets
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.10.7
    namespace: external-secrets

  - name: keda
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: 2.16.0
    namespace: keda

  - name: argo-rollouts
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    targetRevision: 2.37.7
    namespace: argo-rollouts
    helmValues: |
      controller:
        # Register the Gateway API traffic-router plugin so a Rollout can shift
        # weight on a Gateway API HTTPRoute (deploy/helm/commerce-services renders
        # the Rollouts; the BFF route is deploy/istio/httproute-bff.yaml).
        trafficRouterPlugins:
          trafficRouterPlugins: |-
            - name: "argoproj-labs/gatewayAPI"
              location: "https://github.com/argoproj-labs/rollouts-plugin-trafficrouter-gatewayapi/releases/download/v0.5.0/gatewayapi-plugin-linux-amd64"
      dashboard:
        enabled: true

  # Fine-grained (ReBAC) authorization store. The order service consults it for
  # delegated order sharing (ADR-035); the store + model are provisioned out of
  # band (a Job / bootstrap), not by this chart.
  - name: openfga
    repoURL: https://openfga.github.io/helm-charts
    chart: openfga
    targetRevision: 0.2.31
    namespace: commerce
    helmValues: |
      datastore:
        engine: postgres
        # URI from the ExternalSecret `openfga-datastore` (Postgres cluster).
        uriSecret: openfga-datastore
      replicaCount: 2

  - name: kube-prometheus-stack
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 66.3.1
    namespace: observability

  - name: loki
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    targetRevision: 6.24.0
    namespace: observability

  - name: tempo
    repoURL: https://grafana.github.io/helm-charts
    chart: tempo
    targetRevision: 1.14.0
    namespace: observability

  - name: opentelemetry-collector
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.108.0
    namespace: observability

  # The platform's own services (this repo). Deployment + Service + SA + PDB per
  # service; PSS restricted; per-service SPIFFE identity for AuthorizationPolicy.
  - name: commerce-services
    repoURL: https://github.com/deeprath/commerce-platform.git
    targetRevision: main
    path: deploy/helm/commerce-services
    namespace: commerce
