version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversion — noisy on proto int32<->int
        - G124 # http.Cookie Secure flag — deliberately env-driven (COOKIE_SECURE);
               # true in staging/prod, false only for local http. Policy is
               # centralised in services/bff/internal/auth.Broker.
    revive:
      rules:
        # We rely on package-level doc comments + self-explanatory names rather
        # than a doc comment on every exported symbol. Keep the rest of revive.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      - path: gen/go/
        linters: [revive, misspell]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/deeprath/commerce-platform]
