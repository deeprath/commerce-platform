version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  settings:
    gosec:
      excludes:
        - G115 # integer overflow conversion — noisy on proto int32<->int
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      - path: gen/go/
        linters: [revive, misspell]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [github.com/deeprath/commerce-platform]
