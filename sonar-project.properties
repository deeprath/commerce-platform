sonar.projectKey=deeprath_commerce-platform
sonar.organization=deeprath

sonar.sources=pkg,services,proto,web/admin/src,web/storefront/src
sonar.tests=pkg,services,web/admin/src,web/storefront/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
# Each service's main.go is the composition root: telemetry / pool / verifier /
# producer wiring inside one run(). No branching logic to analyse, and the
# wiring is necessarily near-identical across services. It is excluded from
# analysis entirely; behaviour is covered by the per-service integration tests
# and the live compose-stack verification. web/*/src/main.tsx is the same idea
# for the two React apps — ReactDOM bootstrapping only.
# SQL migrations are immutable historical DDL, not maintained application code —
# Sonar's PL/SQL rules (e.g. "extract a constant") do not apply to them.
sonar.exclusions=gen/**,**/*.pb.go,**/*_grpc.pb.go,**/mocks/**,deploy/**,**/main.go,**/migrations/**,web/**/main.tsx,web/**/gen/**,web/**/node_modules/**,web/**/dist/**,web/**/coverage/**
sonar.coverage.exclusions=**/main.go,web/**/main.tsx
# CPD also ignores test files — integration-test scaffolding (throwaway-Postgres
# spin-up, fixture builders) is repetitive by nature and duplicated across a
# service's per-package test files on purpose.
sonar.cpd.exclusions=**/main.go,**/*_test.go,**/*.test.ts,**/*.test.tsx

sonar.go.coverage.reportPaths=coverage.out
# Both properties point at the same lcov files: newer scanner versions read
# .ts/.tsx coverage from sonar.javascript.lcov.reportPaths, older ones look at
# the typescript-specific key — harmless to set both.
sonar.javascript.lcov.reportPaths=web/admin/coverage/lcov.info,web/storefront/coverage/lcov.info
sonar.typescript.lcov.reportPaths=web/admin/coverage/lcov.info,web/storefront/coverage/lcov.info

sonar.sourceEncoding=UTF-8
