sonar.projectKey=deeprath_commerce-platform
sonar.organization=deeprath

sonar.sources=pkg,services,proto
sonar.tests=pkg,services
sonar.test.inclusions=**/*_test.go
sonar.exclusions=gen/**,**/*.pb.go,**/*_grpc.pb.go,**/mocks/**,deploy/**

# main.go in every service is the composition root — telemetry/pool/verifier/
# producer wiring inside one run(). No branching logic to unit-test, and the
# wiring is necessarily near-identical across services, so it is excluded from
# coverage. Behaviour is covered by the per-service integration tests and the
# live compose-stack verification.
sonar.coverage.exclusions=**/main.go
# CPD ignores main.go (see above) and test files — integration-test scaffolding
# (throwaway-Postgres spin-up, fixture builders) is repetitive by nature and
# duplicated across a service's per-package test files on purpose.
sonar.cpd.exclusions=**/main.go,**/*_test.go

sonar.go.coverage.reportPaths=coverage.out

sonar.sourceEncoding=UTF-8
