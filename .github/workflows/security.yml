name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC — full-history + ZAP
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- secret scanning --------------------------------------------------
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks-action needs full history to diff a PR
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: infra/security/.gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

  # ---- dependency / image / IaC scanning ------------------------------
  # Trivy is run via its official install script + the raw CLI so every flag is
  # explicit and the behaviour does not drift with a wrapper action.
  trivy-fs:
    # BLOCKS the build: HIGH/CRITICAL in our own dependencies, plus stray secrets.
    runs-on: ubuntu-latest
    env: { TRIVY_VERSION: v0.74.0 }
    steps:
      - uses: actions/checkout@v4
      - name: install trivy
        # Pull the pinned release tarball directly. The upstream install.sh
        # makes an unauthenticated GitHub API call ("checking for tag ...")
        # that gets rate-limited when the whole trivy matrix runs at once.
        run: |
          ver="${TRIVY_VERSION#v}"
          url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${ver}_Linux-64bit.tar.gz"
          # The GitHub release CDN intermittently drops the TLS handshake
          # (curl exit 35) when ~17 trivy-image matrix jobs pull at once.
          # curl's own --retry covers that; an outer loop with backoff is the
          # last resort before failing the job.
          for attempt in 1 2 3 4 5; do
            curl -sfL --connect-timeout 15 --retry 5 --retry-delay 5 \
              --retry-connrefused --retry-all-errors \
              -o /tmp/trivy.tar.gz "$url" && break
            echo "trivy download attempt ${attempt} failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: trivy fs (vuln + secret) — blocking
        run: |
          trivy fs . \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile infra/security/.trivyignore \
            --exit-code 1

  trivy-config:
    # INFORMATIONAL: IaC / Dockerfile / manifest misconfig. Promote to blocking
    # once the baseline is clean (docs/SECURITY.md §5.2).
    runs-on: ubuntu-latest
    env: { TRIVY_VERSION: v0.74.0 }
    steps:
      - uses: actions/checkout@v4
      - name: install trivy
        run: |
          ver="${TRIVY_VERSION#v}"
          url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${ver}_Linux-64bit.tar.gz"
          # The GitHub release CDN intermittently drops the TLS handshake
          # (curl exit 35) when ~17 trivy-image matrix jobs pull at once.
          # curl's own --retry covers that; an outer loop with backoff is the
          # last resort before failing the job.
          for attempt in 1 2 3 4 5; do
            curl -sfL --connect-timeout 15 --retry 5 --retry-delay 5 \
              --retry-connrefused --retry-all-errors \
              -o /tmp/trivy.tar.gz "$url" && break
            echo "trivy download attempt ${attempt} failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: trivy config — informational
        run: |
          trivy config . \
            --severity HIGH,CRITICAL \
            --ignorefile infra/security/.trivyignore \
            --exit-code 0

  trivy-image:
    # BLOCKS on library packages baked into the image; base-OS CVEs are reported
    # but do not fail (second invocation, --exit-code 0).
    runs-on: ubuntu-latest
    env: { TRIVY_VERSION: v0.74.0 }
    strategy:
      matrix:
        service: [ext-authz, catalog, media, search, bff, storefront, admin, cart, pricing, inventory, payment, order, fulfillment, notification, review, seller, payout, analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # Pull Docker Hub base images (golang:*, etc.) through Google's
          # public pull-through cache — auth.docker.io 500s / anonymous rate
          # limits otherwise flake the whole matrix.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          load: true
          tags: commerce/${{ matrix.service }}:scan
      - name: install trivy
        run: |
          ver="${TRIVY_VERSION#v}"
          url="https://github.com/aquasecurity/trivy/releases/download/${TRIVY_VERSION}/trivy_${ver}_Linux-64bit.tar.gz"
          # The GitHub release CDN intermittently drops the TLS handshake
          # (curl exit 35) when ~17 trivy-image matrix jobs pull at once.
          # curl's own --retry covers that; an outer loop with backoff is the
          # last resort before failing the job.
          for attempt in 1 2 3 4 5; do
            curl -sfL --connect-timeout 15 --retry 5 --retry-delay 5 \
              --retry-connrefused --retry-all-errors \
              -o /tmp/trivy.tar.gz "$url" && break
            echo "trivy download attempt ${attempt} failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          sudo tar -xzf /tmp/trivy.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: trivy image — our libraries (blocking)
        run: |
          trivy image commerce/${{ matrix.service }}:scan \
            --pkg-types library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile infra/security/.trivyignore \
            --exit-code 1
      - name: trivy image — full incl. base OS (informational)
        run: |
          trivy image commerce/${{ matrix.service }}:scan \
            --severity HIGH,CRITICAL \
            --exit-code 0

  # ---- static analysis (SonarCloud — repo is public) -------------------
  # Whole job is skipped until the SONAR_TOKEN repo secret exists
  # (docs/SECURITY.md §5.3 has the one-time setup).
  sonarcloud:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: check for token
        id: gate
        run: echo "enabled=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: "**/go.sum"
      - name: coverage
        if: steps.gate.outputs.enabled == 'true'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true" # see ci.yml test job
        run: infra/security/go-coverage.sh coverage.out
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/storefront/package-lock.json
            web/admin/package-lock.json
      - name: frontend coverage (storefront)
        if: steps.gate.outputs.enabled == 'true'
        working-directory: web/storefront
        run: npm ci && npm run test:coverage
      - name: frontend coverage (admin)
        if: steps.gate.outputs.enabled == 'true'
        working-directory: web/admin
        run: npm ci && npm run test:coverage
      - name: SonarCloud scan
        if: steps.gate.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: note
        if: steps.gate.outputs.enabled != 'true'
        run: echo "::notice::SonarCloud skipped — add the SONAR_TOKEN repo secret to enable (docs/SECURITY.md §5.3)"

  # ---- dynamic scanning (live stack) ---------------------------------
  zap:
    # Needs the whole stack up, so: schedule + manual only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: bring up the stack
        run: |
          cp deploy/compose/.env.example deploy/compose/.env
          docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env up -d --build
      - name: wait for the demo-catalog seeder
        run: docker compose -f deploy/compose/docker-compose.yml wait catalog-seed
      - name: wait for the BFF and a seeded catalog
        run: ./perf/wait-ready.sh
        env:
          TIMEOUT: "240"
      - name: wait for the Envoy edge
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/api/v1/catalog/products && exit 0
            sleep 5
          done
          echo "edge never answered"; exit 1
      - name: ZAP passive baseline + authenticated active scan
        run: ./infra/security/zap-scan.sh
        env:
          ZAP_AUTH_USERNAME: testuser
          ZAP_AUTH_PASSWORD: testuser123
      - name: fail on HIGH alerts
        run: |
          python3 - <<'PY'
          import json, sys, glob
          RISK = {"0": "info", "1": "low", "2": "medium", "3": "high"}
          counts = {}
          highs = []
          for f in sorted(glob.glob("reports/*.json")):
              try:
                  data = json.load(open(f))
              except (ValueError, OSError):
                  continue
              for site in data.get("site", []):
                  for a in site.get("alerts", []):
                      rc = a.get("riskcode", "0")
                      counts[RISK.get(rc, rc)] = counts.get(RISK.get(rc, rc), 0) + 1
                      if rc == "3":
                          highs.append(f"HIGH: {a.get('alert')} [{a.get('pluginid')}] ({f})")
          print("alert counts by risk:", counts or "none")
          for h in highs:
              print(h)
          sys.exit(1 if highs else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports
          path: reports/
      - name: stack logs (on failure)
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --tail=150 bff envoy ext-authz
      - name: tear down
        if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v
