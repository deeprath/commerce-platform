name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: "**/go.sum"
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf format check
        run: buf format --diff --exit-code
      - name: generated stubs are up to date
        run: |
          buf generate
          git diff --exit-code -- gen/ || {
            echo "::error::gen/ is stale — run 'task proto' and commit"; exit 1;
          }
      - name: buf breaking (vs main)
        # Non-blocking until main carries a proto baseline (this PR introduces
        # proto/); becomes enforcing on the next PR after it merges.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main" \
            || echo "::warning::buf breaking skipped/failed — expected until proto/ exists on main"

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pkg, gen/go, services/ext-authz, services/catalog, services/media, services/search, services/bff, services/cart, services/pricing, services/inventory, services/payment, services/order, services/fulfillment, services/notification, services/review, services/seller, services/payout, services/analytics]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: "**/go.sum"
      - name: golangci-lint (${{ matrix.module }})
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest # must be a build whose Go >= our go directive (1.26)
          working-directory: ${{ matrix.module }}
          args: --timeout=5m --config=${{ github.workspace }}/.golangci.yml

  test:
    runs-on: ubuntu-latest
    env:
      # CI runners are ephemeral, so Ryuk (the testcontainers resource reaper)
      # adds nothing — and its startup handshake times out ("wait for reaper:
      # context deadline exceeded") once ~10 integration packages spin up
      # Postgres at once. Containers die with the runner VM instead.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: pkg/go.mod
          cache-dependency-path: "**/go.sum"
      - name: go vet
        run: go vet $(go list -m -f '{{.Dir}}/...')
      - name: go test (race, includes testcontainers integration)
        # -p 4 caps how many integration packages start containers concurrently
        # (each spins up its own Postgres); keeps peak container count sane on a
        # 7 GB runner.
        run: go test -race -shuffle=on -p 4 $(go list -m -f '{{.Dir}}/...')

  web:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [storefront, admin]
    defaults:
      run:
        working-directory: web/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  build-images:
    runs-on: ubuntu-latest
    needs: [proto, test]
    strategy:
      matrix:
        service: [ext-authz, catalog, media, search, bff, storefront, admin, cart, pricing, inventory, payment, order, fulfillment, notification, review, seller, payout, analytics, envoy]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          # Pull Docker Hub base images (golang:*, etc.) through Google's
          # public pull-through cache — auth.docker.io 500s / anonymous rate
          # limits otherwise flake the whole matrix.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/${{ matrix.service }}.Dockerfile
          push: false
          tags: commerce/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: install kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: platform (app-of-apps)
        run: |
          helm lint deploy/helm/platform
          helm template deploy/helm/platform >/dev/null
      - name: commerce-services
        run: |
          helm lint deploy/helm/commerce-services
          # -skip Rollout: the datree CRD-catalog schema for argoproj Rollout
          # lags the controller version and rejects the (valid) setMirrorRoutes
          # step. The Rollout is still helm-lint'd and rendered.
          helm template deploy/helm/commerce-services \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 -skip Rollout \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          helm template deploy/helm/commerce-services -f deploy/helm/commerce-services/values-dev.yaml \
            | kubeconform -strict -summary -kubernetes-version 1.30.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
