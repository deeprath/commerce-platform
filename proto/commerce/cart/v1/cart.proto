syntax = "proto3";

// commerce.cart.v1 — the shopper's active cart, held in Redis with a TTL.
// Never a system of record: a converted cart becomes an order elsewhere.
package commerce.cart.v1;

service CartService {
  rpc GetCart(GetCartRequest) returns (Cart);
  rpc AddItem(AddItemRequest) returns (Cart);
  rpc SetItemQuantity(SetItemQuantityRequest) returns (Cart);
  rpc RemoveItem(RemoveItemRequest) returns (Cart);
  rpc Clear(ClearRequest) returns (Cart);

  // Merge folds a guest cart into the caller's cart on sign-in and deletes the
  // guest cart. Quantities are summed per product.
  rpc Merge(MergeRequest) returns (Cart);
}

message CartItem {
  string product_id = 1;
  int32 quantity = 2;
  string added_at = 3;
}

message Cart {
  string id = 1;
  repeated CartItem items = 2;
  int32 total_quantity = 3;
  string updated_at = 4;
}

message GetCartRequest {
  string cart_id = 1;
}

message AddItemRequest {
  string cart_id = 1;
  string product_id = 2;
  int32 quantity = 3; // must be > 0; added to any existing quantity
}

message SetItemQuantityRequest {
  string cart_id = 1;
  string product_id = 2;
  int32 quantity = 3; // 0 removes the line
}

message RemoveItemRequest {
  string cart_id = 1;
  string product_id = 2;
}

message ClearRequest {
  string cart_id = 1;
}

message MergeRequest {
  string from_cart_id = 1; // guest cart
  string to_cart_id = 2; // the signed-in user's cart
}

// --- events (topic: commerce.cart.<event>) ---

message CheckedOut {
  string cart_id = 1;
  string order_id = 2;
  string occurred_at = 3;
}
