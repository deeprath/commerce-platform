syntax = "proto3";

// commerce.payout.v1 — what the platform owes each marketplace shop.
//
// A payout is created when an order confirms (consumed from
// commerce.order.confirmed): the order's lines are grouped by shop_id (see
// commerce.fulfillment.v1's identical grouping for shipments) and one Payout
// is created per distinct marketplace shop, for the sum of that shop's line
// totals. First-party lines (shop_id "") create no payout — the platform
// already holds that revenue directly.
//
// v1 ships a SANDBOX settlement: a background sweep marks a PENDING payout
// PAID after a short delay, mirroring fulfillment's sandbox carrier. In
// production the sweep is replaced by a real payout-provider integration
// (e.g. Stripe Connect transfers) — the emitted events are identical either
// way. v1 also takes no platform commission: a payout is 100% of the shop's
// line total for that order; a fee/commission model is a deliberate later
// refinement (see ADR-043).
//
// A payout can be reversed. An approved return (commerce.order.return_approved)
// carries a per-shop refund breakdown, and the matching shop's payout is
// reduced by that amount. A reversal against a PENDING payout simply lowers
// what the settlement sweep will pay; against a PAID payout the money has
// already left, so PayoutReversed is the instruction to the payout provider to
// recover it. Reversals accumulate: a payout is REVERSED only once its whole
// amount has been reversed.
package commerce.payout.v1;

import "commerce/common/v1/types.proto";

service PayoutService {
  // GetPayout returns one payout. Caller must be staff of the payout's shop
  // (OpenFGA `shop#staff`), or hold the finance role (platform staff may read
  // any shop's payouts).
  rpc GetPayout(GetPayoutRequest) returns (Payout);

  // ListPayouts lists payouts for one shop, newest first. shop_id is required
  // unless the caller holds the finance role, in which case omitting it lists
  // every shop's payouts (optionally filtered further by shop_id/status).
  rpc ListPayouts(ListPayoutsRequest) returns (ListPayoutsResponse);

  // MarkPaid marks a PENDING payout PAID. Finance role only; idempotent. The
  // sandbox sweep calls this automatically — exposed here for an operator to
  // force a settlement (e.g. in a test environment) without waiting.
  rpc MarkPaid(MarkPaidRequest) returns (Payout);
}

enum PayoutStatus {
  PAYOUT_STATUS_UNSPECIFIED = 0;
  PAYOUT_STATUS_PENDING = 1;
  PAYOUT_STATUS_PAID = 2;
  // Fully reversed — reversed_amount has reached amount. A partly reversed
  // payout keeps its PENDING/PAID status and reports reversed_amount.
  PAYOUT_STATUS_REVERSED = 3;
}

message Payout {
  string id = 1;
  string order_id = 2;
  string shop_id = 3;
  commerce.common.v1.Money amount = 4;
  PayoutStatus status = 5;
  string created_at = 6;
  string paid_at = 7; // set once PAID
  // Cumulative amount reversed by approved returns. Never exceeds amount.
  // What is actually owed (or, once PAID, overpaid) is amount - reversed_amount.
  commerce.common.v1.Money reversed_amount = 8;
  string reversed_at = 9; // set on the most recent reversal
}

message GetPayoutRequest {
  string id = 1;
}

message ListPayoutsRequest {
  string shop_id = 1;
  commerce.common.v1.PageRequest page = 2;
  string status = 3; // optional filter, e.g. "PENDING"
}

message ListPayoutsResponse {
  repeated Payout payouts = 1;
  commerce.common.v1.PageResponse page = 2;
}

message MarkPaidRequest {
  string id = 1;
}

// --- events (topic: commerce.payout.<event>) ---

message PayoutCreated {
  string payout_id = 1;
  string order_id = 2;
  string shop_id = 3;
  commerce.common.v1.Money amount = 4;
  string occurred_at = 5;
}

message PayoutPaid {
  string payout_id = 1;
  string order_id = 2;
  string shop_id = 3;
  string occurred_at = 4;
}

// PayoutReversed is emitted per reversal, not per payout: a second approved
// return against the same order emits a second event. was_paid distinguishes
// the two cases that matter downstream — false means the settlement sweep will
// simply pay less, true means money already left and the provider has to
// recover it.
message PayoutReversed {
  string payout_id = 1;
  string order_id = 2;
  string shop_id = 3;
  commerce.common.v1.Money amount = 4; // this reversal alone
  commerce.common.v1.Money reversed_total = 5; // cumulative, after this one
  bool was_paid = 6;
  string occurred_at = 7;
}
