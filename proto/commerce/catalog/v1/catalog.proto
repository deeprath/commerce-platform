syntax = "proto3";

// Package commerce.catalog.v1 is the product catalog read/write contract.
// Phase 0 ships the contract only — no server implementation yet (see Phase 1).
package commerce.catalog.v1;

import "commerce/common/v1/types.proto";

// CatalogService owns products, variants, and categories.
service CatalogService {
  // GetProduct returns one product by id. NOT_FOUND if it does not exist or
  // is not visible to the caller.
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);

  // ListProducts returns a page of products, newest first, optionally filtered
  // by category.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);

  // BatchGetProducts resolves many ids at once for list/cart rendering.
  // Unknown ids are omitted from the response rather than erroring.
  rpc BatchGetProducts(BatchGetProductsRequest) returns (BatchGetProductsResponse);

  // --- write side (requires the catalog_manager role) ---

  // CreateProduct adds a product in DRAFT status and returns it with its id.
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);

  // UpdateProduct replaces the mutable fields of an existing product.
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);

  // ArchiveProduct moves a product to ARCHIVED (soft delete); it stops
  // appearing in ListProducts/search but existing orders still resolve it.
  rpc ArchiveProduct(ArchiveProductRequest) returns (ArchiveProductResponse);
}

message Product {
  string id = 1;
  string slug = 2;
  string title = 3;
  string description = 4;
  string category_id = 5;
  // List price. Promotions/tax are applied by the pricing service, not here.
  commerce.common.v1.Money list_price = 6;
  // Object-storage keys for media, resolved to URLs by the BFF/CDN.
  repeated string media_keys = 7;
  ProductStatus status = 8;
  // Free-form attributes (colour, size chart, material, ...). Stored as JSONB.
  map<string, string> attributes = 9;
}

enum ProductStatus {
  PRODUCT_STATUS_UNSPECIFIED = 0;
  PRODUCT_STATUS_DRAFT = 1;
  PRODUCT_STATUS_ACTIVE = 2;
  PRODUCT_STATUS_ARCHIVED = 3;
}

message GetProductRequest {
  // Provide exactly one of id or slug.
  string id = 1;
  string slug = 2;
}

message GetProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  // Optional category filter. Empty => all categories.
  string category_id = 1;
  commerce.common.v1.PageRequest page = 2;
}

message ListProductsResponse {
  repeated Product products = 1;
  commerce.common.v1.PageResponse page = 2;
}

message BatchGetProductsRequest {
  repeated string ids = 1;
}

message BatchGetProductsResponse {
  repeated Product products = 1;
}

message CreateProductRequest {
  string slug = 1;
  string title = 2;
  string description = 3;
  string category_id = 4;
  commerce.common.v1.Money list_price = 5;
  repeated string media_keys = 6;
  map<string, string> attributes = 7;
}

message UpdateProductRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  string category_id = 4;
  commerce.common.v1.Money list_price = 5;
  repeated string media_keys = 6;
  map<string, string> attributes = 7;
  ProductStatus status = 8; // DRAFT <-> ACTIVE
}

message ArchiveProductRequest {
  string id = 1;
}

message CreateProductResponse {
  Product product = 1;
}

message UpdateProductResponse {
  Product product = 1;
}

message ArchiveProductResponse {
  Product product = 1;
}
